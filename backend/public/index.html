<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DM authentication check</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="Progress">
      <div class="brand">
        <div class="brand-logo"><img src="/cloudfuze-logo.png" alt="CloudFuze"></div>
        <strong>DM auth check</strong>
        <span>Slack, Teams and Chat migrations</span>
      </div>
      <ol class="steps" id="steps"></ol>
      <div class="who" id="who" hidden>
        <span id="whoName"></span>
        <div class="code-switch" id="codeSwitch" role="group" aria-label="Migration code"></div>
        <button class="btn-signout" id="logoutBtn" type="button">Sign out / switch account</button>
      </div>
    </aside>

    <main class="main">
      <div id="view" class="view" tabindex="-1"></div>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
